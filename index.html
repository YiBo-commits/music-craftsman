<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>音匠工坊｜音乐制作任务派单与教学管理平台</title><link rel="stylesheet" href="style.css"></head>
<body><div id="toast"></div>
<section id="authView" class="auth-view"><div class="auth-art"><div class="auth-logo">♫</div><p>音匠工坊</p><h1>让每一个声音，<br>都被认真完成。</h1><span>音乐制作任务派单与教学管理平台</span><div class="art-wave">〰〰〰〰〰</div></div><div class="auth-card"><div class="auth-heading"><span class="mini-logo">♫</span><h2 id="authTitle">欢迎回来</h2><p id="authIntro">登录后管理你的音乐创作与教学工作</p></div>
<div class="auth-tabs" id="authTabs"><button type="button" data-mode="login" class="active">登录</button><button type="button" data-mode="client">客户注册</button><button type="button" data-mode="staff">工作人员注册</button></div>
<form id="authForm">
<label id="nameWrap">姓名 或 手机号<input id="authName" required placeholder="请输入姓名或手机号"></label>
<label id="roleWrap" class="hidden">申请岗位<select id="authRole"><option value="composer">编曲师</option><option value="mixer">混音师</option><option value="recording">录音老师</option><option value="teacher">课程教师</option></select><small class="field-note">工作人员注册后需管理员审核通过方可登录</small></label>
<div id="contactWrap" class="hidden">
<div class="channel-row"><label class="chan"><input type="radio" name="channel" value="phone" checked>手机号验证</label><label class="chan"><input type="radio" name="channel" value="wechat">微信号验证</label></div>
<label id="contactLabel">手机号<input id="authContact" placeholder="请输入 11 位手机号"></label>
<div class="code-row"><label>验证码<input id="authCode" placeholder="6 位验证码" inputmode="numeric" maxlength="6"></label><button type="button" class="outline" id="sendCode">获取验证码</button></div>
<div id="codeHint" class="code-hint hidden"></div>
</div>
<label>密码<input id="authPassword" required type="password" placeholder="请输入密码（至少 6 位）"></label>
<button class="primary full" id="authSubmit" type="submit">登录</button>
</form>
<p class="demo-link" id="demoHint">初始管理员：林嘉言 / 123456，首次使用请到「系统设置」修改密码</p>
</div></section>
<div id="appView" class="hidden"><aside class="sidebar"><div class="brand"><i>♫</i><span>音匠工坊</span></div><p class="studio">MUSIC STUDIO OS</p><nav id="nav"></nav><div class="sidebar-bottom"><button class="help" data-page="help">？ 使用帮助</button><button class="account" data-page="profile"><span id="avatar" class="avatar"></span><span><b id="accountName"></b><small id="accountRole"></small></span><em>›</em></button></div></aside><main><header><div><p class="eyebrow" id="dateText"></p><h1 id="pageTitle">工作台</h1></div><div class="header-actions"><button class="icon-button" id="notification">♢<i></i></button><button id="headerAction" class="primary">＋ 新建订单</button></div></header><section class="page active" id="dashboard"></section><section class="page" id="market"></section><section class="page" id="neworder"></section><section class="page" id="myorders"></section><section class="page" id="mycourses"></section><section class="page" id="manageorders"></section><section class="page" id="courses"></section><section class="page" id="schedule"></section><section class="page" id="ledger"></section><section class="page" id="team"></section><section class="page" id="settings"></section><section class="page" id="profile"></section><section class="page" id="help"></section></main></div>
<dialog id="modal"><form method="dialog" id="modalForm"><div class="dialog-head"><div><p class="eyebrow" id="modalEyebrow"></p><h2 id="modalTitle"></h2></div><button class="close" value="cancel">×</button></div><div id="modalBody" class="modal-body"></div><div class="dialog-foot" id="modalFoot"></div></form></dialog><script src="app.js"></script></body></html>
