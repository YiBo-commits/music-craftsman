<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>音匠工坊｜音乐制作任务派单与教学管理平台</title><link rel="stylesheet" href="style.css"></head>
<body><div id="toast"></div>
<section id="authView" class="auth-view"><div class="auth-art"><div class="auth-logo">♫</div><p>音匠工坊</p><h1>让每一个声音，<br>都被认真完成。</h1><span>音乐制作任务派单与教学管理平台</span><div class="art-wave">〰〰〰〰〰</div></div><div class="auth-card"><div class="auth-heading"><span class="mini-logo">♫</span><h2 id="authTitle">欢迎回来</h2><p id="authIntro">登录后管理你的音乐创作与教学工作</p></div><form id="authForm"><label>姓名或手机号<input id="authName" required placeholder="请输入姓名或手机号"></label><label id="roleWrap" class="hidden">注册身份<select id="authRole"><option value="composer">编曲师</option><option value="mixer">混音师</option><option value="recording">录音老师</option><option value="teacher">课程教师</option><option value="client">客户 / 学员</option></select></label><label>密码<input id="authPassword" required type="password" placeholder="请输入密码"></label><button class="primary full" id="authSubmit" type="submit">登录</button></form><button class="plain-link" id="toggleAuth">还没有账号？立即注册</button><button class="demo-link" id="demoLogin">以管理员身份体验 →</button></div></section>
<div id="appView" class="hidden"><aside class="sidebar"><div class="brand"><i>♫</i><span>音匠工坊</span></div><p class="studio">MUSIC STUDIO OS</p><nav id="nav"></nav><div class="sidebar-bottom"><button class="help" data-page="help">？ 使用帮助</button><button class="account" data-page="profile"><span id="avatar" class="avatar"></span><span><b id="accountName"></b><small id="accountRole"></small></span><em>›</em></button></div></aside><main><header><div><p class="eyebrow" id="dateText"></p><h1 id="pageTitle">工作台</h1></div><div class="header-actions"><button class="icon-button" id="notification">♢<i></i></button><button id="headerAction" class="primary">＋ 新建订单</button></div></header><section class="page active" id="dashboard"></section><section class="page" id="market"></section><section class="page" id="myorders"></section><section class="page" id="manageorders"></section><section class="page" id="courses"></section><section class="page" id="schedule"></section><section class="page" id="team"></section><section class="page" id="profile"></section><section class="page" id="help"></section></main></div>
<dialog id="modal"><form method="dialog" id="modalForm"><div class="dialog-head"><div><p class="eyebrow" id="modalEyebrow"></p><h2 id="modalTitle"></h2></div><button class="close" value="cancel">×</button></div><div id="modalBody" class="modal-body"></div><div class="dialog-foot" id="modalFoot"></div></form></dialog><script src="app.js"></script></body></html>
